<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kod Arena | Şahin Giriş Ekranı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0D;--bg2:#17181C;--tx:#fff;--tx2:#A7A7A7;--gold:#C9A45C;--line:rgba(255,255,255,.09);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;display:grid;grid-template-rows:1fr;overflow:hidden}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 20px;min-height:0;background:radial-gradient(520px 380px at 50% 28%,rgba(201,164,92,.10),transparent 70%)}
.mascot{position:relative;width:170px;height:150px;z-index:1;flex:none;margin-bottom:-46px}
.sahin{position:absolute;inset:0;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.sahin img{position:absolute;inset:0;width:100%;height:100%;opacity:0;display:block;-webkit-user-drag:none;user-select:none}
.mascot[data-goz=acik] .f-acik,.mascot[data-goz=yari] .f-yari,.mascot[data-goz=kapali] .f-kapali{opacity:1}
.mascot.mutlu .sahin{animation:ziplama 1.1s ease 2;filter:drop-shadow(0 0 18px rgba(201,164,92,.5))}
@keyframes ziplama{50%{transform:translateY(-8px) scale(1.03)}}
.card{position:relative;z-index:2;width:100%;max-width:380px;padding:30px 24px 22px;background:#17181C;border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
h1{font:800 30px/1.1 Manrope,sans-serif;text-align:center;margin:0 0 6px;color:var(--gold);letter-spacing:.01em}
.alt{text-align:center;color:var(--tx2);font-size:14px;margin:0 0 20px}
.alan{position:relative;margin-bottom:12px}
input[type=text],input[type=password]{width:100%;height:50px;padding:0 16px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:14px;font:500 15px Inter,sans-serif;outline:0;transition:border-color .3s,box-shadow .3s}
input::placeholder{color:#6f7076}
input:focus-visible{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,164,92,.18)}
.goster{position:absolute;right:6px;top:6px;width:38px;height:38px;border:0;background:none;color:var(--tx2);cursor:pointer;border-radius:10px;display:grid;place-items:center}
.goster:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.satir{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--tx2);margin:6px 0 16px}
.satir label{display:flex;align-items:center;gap:8px;cursor:pointer}
.satir input{accent-color:var(--gold);width:16px;height:16px}
.satir a{color:var(--tx2);text-decoration:none}.satir a:hover{color:var(--gold)}
.hata{min-height:18px;margin:-6px 0 6px;font-size:13px;color:#e08a7a}
.btn{position:relative;width:100%;height:54px;border:0;border-radius:14px;background:linear-gradient(180deg,#d6b46c,#B08F4A);color:#17130a;font:700 16px Manrope,sans-serif;cursor:pointer;text-align:left;padding:0 20px;overflow:hidden;perspective:200px;transition:filter .3s}
.btn:hover{filter:brightness(1.07)}
.kapi{position:absolute;right:18px;top:10px;width:26px;height:34px;perspective:120px}
.kapi__cerceve{position:absolute;inset:0;border:2px solid #17130a;border-radius:3px 3px 0 0;background:#17130a}
.kapi__isik{position:absolute;inset:2px;background:#fff3cf;opacity:0;transition:opacity .6s}
.kapi__panel{position:absolute;inset:2px;background:#3a2c10;border-radius:1px;transform-origin:left center;transition:transform 1s cubic-bezier(.4,0,.2,1)}
.kapi__panel::after{content:"";position:absolute;right:3px;top:50%;width:3px;height:3px;border-radius:50%;background:var(--gold)}
.kapi__kisi{position:absolute;right:76px;bottom:7px;width:16px;height:32px;overflow:visible}
.bacak{transform-origin:8px 19px;transform-box:view-box}
.bacak.on{transform:rotate(-15deg)}.bacak.arka{transform:rotate(15deg)}
.acik .kapi__panel{transform:rotateY(-72deg)}
.acik .kapi__isik{opacity:.95}
.yuruyor .bacak.on{animation:adim .55s linear infinite}
.yuruyor .bacak.arka{animation:adim .55s linear -.275s infinite}
@keyframes adim{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
.iceri .kapi__kisi{animation:gir 1.5s linear forwards}
@keyframes gir{0%{transform:none;opacity:1}78%{transform:translateX(53px);opacity:1}100%{transform:translateX(55px) scale(.55);opacity:0}}
.geri .kapi__kisi{animation:belir .6s ease}
@keyframes belir{from{opacity:0}}
.yeni{text-align:center;font-size:13px;color:var(--tx2);margin:16px 0 0}
.yeni a{color:var(--tx);text-decoration:none;font-weight:600}
.logo{display:block;width:min(190px,24vh);height:auto;margin-top:10px;-webkit-user-drag:none;user-select:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const maskot=$('mascot'),sahin=$('sahin'),kul=$('kullanici'),sif=$('sifre'),btn=$('btn'),form=$('form');
const bekle=ms=>new Promise(r=>setTimeout(r,ms));
let mesgul=false;

kul.addEventListener('input',()=>{
  const d=Math.max(-6,Math.min(6,(kul.value.length-7)*.9));
  sahin.style.transform='translateX('+d*1.5+'px) rotate('+d+'deg)';
});
kul.addEventListener('focus',()=>{kul.dispatchEvent(new Event('input'))});
let gozNo=0;
async function goz(hedef){
  const no=++gozNo,simdi=maskot.dataset.goz;
  if(simdi===hedef)return;
  maskot.dataset.goz='yari';
  if(hedef==='yari')return;
  await bekle(170);
  if(no===gozNo)maskot.dataset.goz=hedef;
}
sif.addEventListener('focus',()=>{vur('tok');sahin.style.transform='none';goz(sif.type==='text'?'yari':'kapali')});
sif.addEventListener('blur',()=>goz('acik'));
$('goster').addEventListener('click',()=>{
  const ac=sif.type==='password';
  sif.type=ac?'text':'password';
  if(document.activeElement===sif||maskot.dataset.goz!=='acik')goz(ac?'yari':'kapali');
  $('goster').setAttribute('aria-label',ac?'Şifreyi gizle':'Şifreyi göster');
});

form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(mesgul)return;
  if(!kul.value||!sif.value){$('hata').textContent='Kullanıcı adını ve şifreyi yaz.';return}
  $('hata').textContent='';
  mesgul=true;sif.blur();sif.type='password';
  vur('tik');setTimeout(()=>vur('kapi'),170);
  btn.classList.add('acik');
  await bekle(1100);
  btn.classList.add('yuruyor','iceri');vur('yuru');adimlar(4);
  await bekle(1550);
  btn.classList.remove('yuruyor','acik'); /* figür içeri girdi, kapı kapanır */
  setTimeout(()=>vur('kapi'),650);
  await bekle(1100);
  maskot.classList.add('mutlu');vur('mutlu');
  $('baslik').textContent='Giriş yapıldı';
  $('alt').textContent='Şahin seni tanıdı. Hoş geldin!';
  $('etiket').textContent='Hoş geldin ✓';
  await bekle(3200);
  btn.classList.remove('iceri');btn.classList.add('geri');setTimeout(()=>btn.classList.remove('geri'),700);
  maskot.classList.remove('mutlu');
  $('baslik').textContent='Tekrar hoş geldin';
  $('alt').textContent='Şifren güvende, şahin bakmıyor.';
  $('etiket').textContent='Giriş Yap';
  kul.value='';sif.value='';sahin.style.transform='none';
  mesgul=false;
});


/* ---- Ses efektleri (Web Audio ile üretilir, dosya gerekmez). M: sesi aç/kapat, ?ses=0: kapalı başlat ---- */
let AC=null,SESLI=!/[?&]ses=0/.test(location.search);
function ac(){
  if(!SESLI)return null;
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();ornekleriYukle(AC)}catch(e){return null}}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function vurus(c,{f=1000,q=1.2,sure=.03,kazanc=.3,tip='bandpass'}){
  const n=Math.max(1,Math.floor(c.sampleRate*sure)),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
  s.buffer=b;fl.type=tip;fl.frequency.value=f;fl.Q.value=q;g.gain.value=kazanc;
  s.connect(fl);fl.connect(g);g.connect(c.destination);s.start();
}
function tok(c,{a=200,b=70,sure=.12,kazanc=.4}){
  const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
  o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+sure);
  g.gain.setValueAtTime(kazanc,t);g.gain.exponentialRampToValueAtTime(.001,t+sure+.03);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+sure+.05);
}
function vurSentez(ad){
  const c=ac();if(!c)return;
  const r=.92+Math.random()*.16;
  if(ad==='t1'){vurus(c,{f:1100*r,sure:.03,kazanc:.34});tok(c,{a:260,b:120,sure:.03,kazanc:.12})}
  else if(ad==='t2'){vurus(c,{f:780*r,sure:.03,kazanc:.24});tok(c,{a:200,b:100,sure:.03,kazanc:.1})}
  else if(ad==='tok'){tok(c,{a:240,b:80,sure:.16,kazanc:.5});vurus(c,{f:500,q:.8,sure:.08,kazanc:.12,tip:'lowpass'})}
  else if(ad==='tik'){vurus(c,{f:2400,q:3,sure:.018,kazanc:.42});tok(c,{a:1500,b:900,sure:.015,kazanc:.08})}
  else if(ad==='kapi'){tok(c,{a:170,b:60,sure:.14,kazanc:.55});vurus(c,{f:450,q:.7,sure:.28,kazanc:.2,tip:'lowpass'})}
  else if(ad==='adim'){tok(c,{a:150*r,b:65,sure:.09,kazanc:.42});vurus(c,{f:300,q:.7,sure:.05,kazanc:.12,tip:'lowpass'})}
