<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kod Arena | Şahin Giriş Ekranı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stil.css">
</head>
<body>
  <main class="sahne">

    <!-- Kartın arkasından bakan şahin: gözleri data-goz ile kontrol edilir -->
    <div class="maskot" id="maskot" data-goz="acik" aria-hidden="true">
      <img class="maskot-acik" src="sahin-acik.png" alt="">
      <img class="maskot-kapali" src="sahin-kapali.png" alt="">
    </div>

    <form class="kart" id="kart" novalidate>
      <h1 id="baslik">Tekrar hoş geldin</h1>
      <p class="alt-baslik" id="altBaslik">Şifren güvende, şahin bakmıyor.</p>

      <label class="alan">
        <input type="text" id="kullanici" placeholder="Kullanıcı adı" autocomplete="username">
      </label>

      <label class="alan">
        <input type="password" id="sifre" placeholder="Şifre" autocomplete="current-password">
        <button type="button" class="goz-btn" id="gozBtn" aria-label="Şifreyi göster">
          <svg viewBox="0 0 24 24"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </label>

      <div class="hata" id="hata" role="alert"></div>

      <div class="satir">
        <label class="hatirla"><input type="checkbox" id="hatirla"><span></span>Beni hatırla</label>
        <a href="#" class="soluk">Şifremi unuttum</a>
      </div>

      <button type="submit" class="giris-btn" id="girisBtn">
        <span id="girisYazi">Giriş Yap</span>
        <span class="kapi-ikon" aria-hidden="true">
          <span class="kapi"></span>
          <svg class="adam" viewBox="0 0 20 34"><circle cx="10" cy="6" r="4"/><path d="M10 10v12M10 14l-6 6M10 14l6 6M10 22l-5 10M10 22l5 10"/></svg>
        </span>
      </button>

      <p class="kayit">Hesabın yok mu? <a href="#">Kayıt ol</a></p>
    </form>

    <img class="logo" src="logo.png" alt="Kod Arena - Yazılım & Tasarım">
  </main>

  <script src="giris.js"></script>
</body>
</html>
